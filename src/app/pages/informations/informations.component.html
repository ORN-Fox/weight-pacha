<div class="card-page-title highlight-card card-small">
    <img src="https://cdn-icons-png.flaticon.com/128/2829/2829740.png" alt="">
    <h1 class="title">Informations</h1>
</div>

<form class="mb-5" [formGroup]="petForm" (ngSubmit)="saveChanges()">
    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">Prenom</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control is-expanded has-icons-left">
                    <input class="input" type="text" formControlName="firstName" placeholder="Boris, Lilou, Caramel ..."
                           [ngClass]="{'is-danger': petForm.get('firstName')?.errors?.['required'] && petForm.get('firstName')?.touched}">
                    <span class="icon is-small is-left">
                        <i class="far fa-heart"></i>
                    </span>
                </div>
                <p class="help is-danger" *ngIf="petForm.get('firstName')?.errors?.['required'] && petForm.get('firstName')?.touched">
                    Le prénom est requis
                </p>
            </div>
        </div>
    </div>
    
    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">Espece</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control radios">
                    <label class="radio custom-radio-with-icon" [ngClass]="{'active': petForm.get('specie')?.value == 0}">
                        <input type="radio" formControlName="specie" value="0" />
                        <img src="https://cdn-icons-png.flaticon.com/32/2829/2829823.png" alt="" > Chien
                    </label>
                    <label class="radio custom-radio-with-icon" [ngClass]="{'active': petForm.get('specie')?.value == 1}">
                        <input type="radio" formControlName="specie" value="1" />
                        <img src="https://cdn-icons-png.flaticon.com/32/2829/2829740.png" alt=""> Chat
                    </label>
                    <label class="radio custom-radio-with-icon" [ngClass]="{'active': petForm.get('specie')?.value == 2}">
                        <input type="radio" formControlName="specie" value="2" />
                        <img src="https://cdn-icons-png.flaticon.com/32/4185/4185015.png" alt=""> Lapin
                    </label>
                    <label class="radio custom-radio-with-icon" [ngClass]="{'active': petForm.get('specie')?.value == 3}">
                        <input type="radio" formControlName="specie" value="3" />
                        <img src="https://cdn-icons-png.flaticon.com/32/427/427487.png" alt=""> Autres
                    </label>
                </div>
                <p class="help is-danger" *ngIf="petForm.get('specie')?.errors?.['required'] && petForm.get('specie')?.touched">
                    Le prénom est requis
                </p>
            </div>
        </div>
    </div>

    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">Race</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control is-expanded has-icons-left">
                    <input class="input" type="text" formControlName="breed" placeholder="Domestique, Belier, Golden ...">
                    <span class="icon is-small is-left">
                        <i class="far fa-quote-right"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">Couleur</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control is-expanded has-icons-left">
                    <input class="input" type="text" formControlName="color" placeholder="Creme, Noir, Blanc ...">
                    <span class="icon is-small is-left">
                        <i class="far fa-palette"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="field is-horizontal">
        <div class="field-label">
            <label class="label">Sexe</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control radios">
                    <label class="radio custom-radio-with-icon radio-female" [ngClass]="{'active': petForm.get('sex')?.value == 0}">
                        <input type="radio" formControlName="sex" value="0">
                        <i class="far fa-venus fa-2x"></i> Femelle
                    </label>
                    <label class="radio custom-radio-with-icon radio-male" [ngClass]="{'active': petForm.get('sex')?.value == 1}">
                        <input type="radio" formControlName="sex" value="1">
                        <i class="far fa-mars fa-2x"></i> Male
                    </label>
                </div>
            </div>
        </div>
    </div>
    
    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">Date de naissance</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control is-expanded has-icons-left">
                    <input id="birthDateInput" class="input" type="text" formControlName="birthDate" placeholder="jj/mm/aaaa">
                    <span class="icon is-small is-left">
                        <i class="far fa-calendar"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">Date d'adoption</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control is-expanded has-icons-left">
                    <input id="adoptedDateInput" class="input" type="text" formControlName="adoptedDate" placeholder="jj/mm/aaaa">
                    <span class="icon is-small is-left">
                        <i class="far fa-calendar"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="field is-horizontal">
        <div class="field-label">
            <label class="label">Sterilize ?</label>
        </div>
        <div class="field-body">
            <div class="field">
                <label class="switch is-outlined">
                    <input type="checkbox" formControlName="sterilise">
                    <span class="check"></span>
                    <span class="control-label">{{petForm.get('sterilise')?.value == true ? 'Oui' : 'Non'}}</span>
                </label>
            </div>
        </div>
    </div>
    
    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">N' Micropuce / Tatouage</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control is-expanded has-icons-left">
                    <input class="input" type="text" formControlName="tagNumber" placeholder="0123456789">
                    <span class="icon is-small is-left">
                        <i class="far fa-tag"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>
    
    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">N' Medaille de Rage</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control is-expanded has-icons-left">
                    <input class="input" type="text" formControlName="tagRageNumber" placeholder="0123456789">
                    <span class="icon is-small is-left">
                        <i class="far fa-tag"></i>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="field is-horizontal">
        <div class="field-label is-normal">
            <label class="label">Description</label>
        </div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <textarea class="textarea" formControlName="description" rows="4" 
                              placeholder="Quelques lignes sur votre animal (details importants, allergies, preferences, etc...)">
                    </textarea>
                </div>
            </div>
        </div>
    </div>
    
    <div class="field is-horizontal">
        <div class="field-label"></div>
        <div class="field-body">
            <div class="field">
                <div class="control">
                    <button type="submit" class="button is-primary"><i class="far fa-bookmark mr-2"></i> Enregistrer</button>
                </div>
            </div>
        </div>
    </div>
</form>
