<div class="fixed-grid has-4-cols">
    <div class="grid">
        @for (page of pages; track page) {
            <div class="cell">
                <a class="card is-flex is-justify-content-center is-align-content-center has-text-centered" routerLink="/{{page.path}}">
                    <div class="card-content">
                        <img [src]="page.iconSrc" alt="">
                        <h1 class="title">{{ page.title }}</h1>
                    </div>
                </a>
            </div>
        }
    </div>
</div>
