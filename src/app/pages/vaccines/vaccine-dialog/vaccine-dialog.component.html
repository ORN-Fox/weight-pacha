<form [formGroup]="vaccineForm" (ngSubmit)="saveVaccine()">
    <div class="modal-header">
        <h2 class="modal-title">{{ ("pages.vaccines." + (addMode ? "addTitle" : "editTitle")) | translate }}</h2>
    </div>

    <mat-dialog-content>
        <div class="field">
            <label class="label">{{ "commons.fields.date" | translate }}</label>
            <div class="control has-icons-left">
                <input type="text" id="injectionDateInput" class="input" formControlName="injectionDate" placeholder="{{ 'commons.dateFormats.date' | translate}}"
                    [ngClass]="{'is-danger': vaccineForm.get('injectionDate')?.errors?.['required'] && (isSubmitted || vaccineForm.get('injectionDate')?.value === '')}">
                <span class="icon is-small is-left">
                    <i class="far fa-calendar"></i>
                </span>
            </div>
            <app-form-error [form]="vaccineForm" fieldName="injectionDate" errorRuleName="required" errorMessage="commons.errors.dateRequired" customClass="is-danger" [isDate]="true" [isSubmitted]="isSubmitted"></app-form-error>
        </div>

        <div class="field">
            <label class="label">{{ "commons.fields.title" | translate }}</label>
            <div class="control has-icons-left">
                <input type="text" class="input" name="name" formControlName="name" placeholder="{{ 'commons.fields.title' | translate}}"
                    [ngClass]="{'is-danger': vaccineForm.get('name')?.errors?.['required'] && (isSubmitted || vaccineForm.get('name')?.touched)}">
                <span class="icon is-small is-left">
                    <i class="far fa-tag"></i>
                </span>
            </div>
            <app-form-error [form]="vaccineForm" fieldName="name" errorRuleName="required" errorMessage="commons.errors.titleRequired" customClass="is-danger" [isSubmitted]="isSubmitted"></app-form-error>
        </div>

        <div class="field">
            <label class="label">{{ "commons.fields.reminderDate" | translate }}</label>
            <div class="control has-icons-left">
                <input type="text" id="reminderDateInput" class="input" formControlName="reminderDate" placeholder="{{ 'commons.dateFormats.date' | translate}}"
                    [ngClass]="{'is-danger': vaccineForm.get('reminderDate')?.errors?.['sameOrBeforeReminderDateError'] && vaccineForm.get('reminderDate')?.value}">
                <span class="icon is-small is-left">
                    <i class="far fa-calendar"></i>
                </span>
            </div>
            @if (vaccineForm.get('reminderDate')?.errors?.['sameOrBeforeReminderDateError'] && vaccineForm.get('reminderDate')?.value) {
                <p class="help is-danger">{{ "pages.vaccines.errors.sameOrBeforeReminderDateError" | translate }}</p>
            }
        </div>

        <div class="field">
            <label class="label">{{ "commons.fields.description" | translate }}</label>
            <textarea class="textarea" name="description" rows="3" formControlName="description" placeholder="{{ 'commons.fields.description' | translate}}"
                [ngClass]="{'is-danger': vaccineForm.get('description')?.errors?.['required'] && vaccineForm.get('description')?.touched}"></textarea>
        </div>
    </mat-dialog-content>
    
    <mat-dialog-actions>
        <button type="button" class="button" mat-dialog-close>
            {{ "commons.actions.cancel" | translate }}
        </button>

        <app-action-button type="submit" title="commons.actions.save" customClass="is-primary ml-2" icon="far fa-bookmark mr-2"
            [isLoading]="isLoading"></app-action-button>
    </mat-dialog-actions>
</form>
