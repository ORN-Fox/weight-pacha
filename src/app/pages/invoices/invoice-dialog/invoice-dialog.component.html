<form [formGroup]="invoiceForm" (ngSubmit)="saveInvoice()">
    <div class="modal-header">
        <h2 class="modal-title">{{ ("pages.invoices." + (addMode ? "addTitle" : "editTitle")) | translate }}</h2>
    </div>

    <mat-dialog-content>
        <div class="field">
            <label class="label">{{ "commons.fields.date" | translate }}</label>
            <div class="control has-icons-left">
                <input type="text" id="billingDateInput" class="input" formControlName="billingDate" placeholder="{{ 'commons.dateFormats.date' | translate}}"
                    [ngClass]="{'is-danger': invoiceForm.get('billingDate')?.errors?.['required'] && (isSubmitted || invoiceForm.get('billingDate')?.value === '')}">
                <span class="icon is-small is-left">
                    <i class="far fa-calendar"></i>
                </span>
            </div>
            <app-form-error [form]="invoiceForm" fieldName="billingDate" errorRuleName="required" errorMessage="commons.errors.dateRequired" customClass="is-danger" [isDate]="true" [isSubmitted]="isSubmitted"></app-form-error>
        </div>

        <div class="field">
            <label class="label">{{ "commons.fields.amount" | translate }}</label>
            <div class="control has-icons-{{ displaySignPosition }}">
                <input type="number" class="input" formControlName="amount" step="any" min="0" placeholder="123"
                    [ngClass]="{'is-danger': invoiceForm.get('amount')?.errors?.['required'] && (isSubmitted || invoiceForm.get('amount')?.touched)}">
                <span class="icon is-small is-{{ displaySignPosition }}">
                    {{ 'commons.moneySymbol' | translate }}
                </span>
            </div>
            <app-form-error [form]="invoiceForm" fieldName="amount" errorRuleName="required" errorMessage="pages.invoices.errors.amountRequired" customClass="is-danger" [isSubmitted]="isSubmitted"></app-form-error>
            <app-form-error [form]="invoiceForm" fieldName="amount" errorRuleName="min" errorMessage="pages.invoices.errors.minAmountError" customClass="is-danger" [isSubmitted]="isSubmitted"></app-form-error>
        </div>

        <div class="field">
            <label class="label">{{ "commons.fields.description" | translate }}</label>
            <textarea class="textarea" name="description" rows="3" formControlName="description" placeholder="{{ 'commons.fields.description' | translate}}"
                [ngClass]="{'is-danger': invoiceForm.get('description')?.errors?.['required'] && invoiceForm.get('description')?.touched}"></textarea>
        </div>
    </mat-dialog-content>
    
    <mat-dialog-actions>
        <button type="button" class="button" mat-dialog-close>
            {{ "commons.actions.cancel" | translate }}
        </button>

        <app-action-button type="submit" title="commons.actions.save" customClass="is-primary ml-2" icon="far fa-bookmark mr-2" [isLoading]="isLoading"></app-action-button>
    </mat-dialog-actions>
</form>
