<div class="box measure-content">
  <p>Date : {{ measure.date.format('DD/MM/YYYY HH:mm') }}</p>
  @if (measure.weigth) {
    <p>Poids : {{ measure.weigth }} {{ measureUnitLabel }}</p>
  }
  @if (!measure.weigth) {
    <p>Non pesé</p>
  }

  <button type="button" class="delete" (click)="deleteMeasure()"></button>
</div>
